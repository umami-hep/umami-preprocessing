resampling:
  target: ghostcjets
  method: countup
  sampling_fraction: 1
  variables:
    pt_btagJes:
      bins: [[20_000, 250_000, 46], [250_000, 1_000_000, 30], [1_000_000, 6_000_000, 20]]
    absEta_btagJes:
      bins: [[0, 2.5, 10]]

# note: sensible defaults are defined in the PreprocessingConfig constructor
global:
  jets_name: jets
  batch_size: 1_000_000
  num_jets_estimate: 50_000_000
  num_jets_estimate_plotting: 10_000_000
  num_jets_per_output_file: 5_000_000
  base_dir: /srv/beegfs/scratch/groups/rodem/DAOD_FTAG/p7349/upp_260728/
  out_dir: /srv/beegfs/scratch/groups/rodem/DAOD_FTAG/p7349/upp_260728/out/
